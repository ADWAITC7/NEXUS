<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta
      name="description"
      content="NEXUS — an immersive digital experience."
    />
    <style>
      /*
       * The preloader paints before any JavaScript arrives and is dismissed
       * by the app once fonts and the first rendered frames are in. A seed,
       * pulsing: the whole site in one dot.
       */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99;
        background: #d1d1d1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s ease;
      }
      #preloader.preloader-done {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .pl-seed {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #3a5110;
        animation: pl-pulse 1.1s ease-in-out infinite;
      }
      @keyframes pl-pulse {
        0%, 100% { transform: scale(1); opacity: 0.45; }
        50% { transform: scale(2.4); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="preloader" aria-hidden="true"><div class="pl-seed"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
